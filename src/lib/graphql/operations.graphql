query GetOwner($id: ID!) {
  owner(id: $id) {
    id
    name
    email
    pets {
      id
      name
      type
      breed
      age
      weight
      lifelong_conditions {
        id
        condition
        treatment
      }
      active_treatments {
        id
        start_date
        end_date
        condition
        treatment
      }
      appointments {
        id
        datetime
        status
        doctor {
          id
          name
        }
        patient {
          id
          name
        }
      }
    }
  }
}

query GetDoctors($limit: Int, $skip: Int, $name: String, $specializationId: ID) {
  doctors(limit: $limit, skip: $skip, name: $name, specializationId: $specializationId) {
    items {
      id
      name
      clinic_address
      clinic_name
      email
      specializations {
        id
        name
      }
    }
    totalCount
  }
}

query GetSpecializations {
  specializations {
    id
    name
  }
}

query GetDoctor($id: ID!) {
  doctor(id: $id) {
    id
    name
    email
    clinic_name
    clinic_address
    specializations {
      id
      name
      services {
        id
        name
        price
      }
    }
    availabilities {
      id
      available_datetime
    }
    appointments {
      id
      datetime
      status
      patient {
        id
        name
        owner {
          id
          name
        }
      }
    }
    patients {
      id
      name
      owner {
        id
        name
      }
    }
  }
}

query GetAppointment($id: ID!) {
  appointment(id: $id) {
    id
    datetime
    status
    reason
    consultation_type
    investigation
    investigation_result
    doctor {
      id
      name
      clinic_name
    }
    patient {
      id
      name
      type
      breed
      age
      weight
      owner {
        id
        name
      }
      lifelong_conditions {
        id
        condition
        treatment
      }
      active_treatments {
        id
        start_date
        end_date
        treatment
        condition
      }
    }
  }
}

query GetPet($id: ID!) {
  pet(id: $id) {
    id
    name
    type
    breed
    age
    weight
    owner {
      id
      name
      email
    }
    lifelong_conditions {
      id
      condition
      treatment
    }
    active_treatments {
      id
      condition
      treatment
      start_date
    }
    appointments {
      id
      datetime
      consultation_type
      doctor {
        id
        name
      }
    }
  }
}

